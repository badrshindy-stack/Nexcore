<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Nexcore - نظام إدارة المستشفيات</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .navbar {
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      flex-wrap: wrap;
      gap: 10px;
    }
    .navbar h1 { color: #667eea; font-size: 28px; }
    .user-info { text-align: center; }
    .user-info p { color: #666; font-size: 14px; }
    .user-info b { color: #667eea; display: block; margin-top: 4px; }
    .logout-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .logout-btn:hover { background: #ff5252; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-5px); }
    .card h2 { color: #667eea; margin-bottom: 16px; font-size: 20px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #667eea;
      outline: none;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.3s;
    }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5568d3; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-secondary:hover { background: #e0e0e0; }
    .btn-success { background: #51cf66; color: white; }
    .btn-success:hover { background: #40c057; }
    .btn-danger { background: #ff6b6b; color: white; }
    .btn-danger:hover { background: #fa5252; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    
    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      overflow-x: auto;
      display: block;
    }
    .table th {
      background: #f5f5f5;
      padding: 12px;
      text-align: right;
      border-bottom: 2px solid #e0e0e0;
      font-weight: bold;
    }
    .table td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
    .table tr:hover { background: #f9f9f9; }
    
    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: bold;
      display: none;
    }
    .alert-success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; display: block; }
    .alert-error { background: #f8d7da; color: #721c24; border-left: 4px solid #f5c6cb; display: block; }
    .alert-info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; display: block; }
    
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px;
      text-align: center;
      width: 100%;
    }
    .login-card .logo {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .login-card h1 { color: #667eea; margin-bottom: 8px; }
    .login-card p { color: #999; margin-bottom: 30px; }
    
    .section { display: none; }
    .section.active { display: block; }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-box .number { font-size: 32px; font-weight: bold; }
    .stat-box .label { font-size: 14px; opacity: 0.9; margin-top: 4px; }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tabs .btn { flex: 1; min-width: 120px; }
    
    .payment-result {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #d4edda;
      border-radius: 8px;
      border-left: 4px solid #28a745;
    }
    .payment-result.show { display: block; }
    .payment-result .txid {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      background: #f8f9fa;
      padding: 8px;
      border-radius: 4px;
      margin-top: 8px;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* تحسينات للشاشات الصغيرة */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        text-align: center;
      }
      .stats {
        grid-template-columns: 1fr 1fr;
      }
      .tabs .btn {
        flex: 1 1 45%;
        font-size: 12px;
        padding: 10px;
      }
      .table {
        font-size: 12px;
      }
      .table th, .table td {
        padding: 8px 4px;
      }
      .login-card {
        padding: 24px;
        margin: 10px;
      }
    }
    @media (max-width: 480px) {
      .stats {
        grid-template-columns: 1fr;
      }
      .tabs .btn {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <!-- صفحة تسجيل الدخول -->
  <div id="loginPage" class="login-page section active">
    <div class="login-card">
      <div class="logo">🏥</div>
      <h1>Nexcore</h1>
      <p>نظام إدارة المستشفيات والمخزون</p>
      <div id="piStatus" class="alert alert-info" style="margin-bottom: 16px;">
        ⏳ جاري تحميل Pi SDK...
      </div>
      <button class="btn btn-primary" onclick="login()" style="width: 100%;" id="loginBtn">
        تسجيل الدخول عبر Pi
      </button>
      <div id="loginLog" class="alert" style="margin-top: 20px;"></div>
    </div>
  </div>

  <!-- الصفحة الرئيسية -->
  <div id="dashboard" class="section">
    <div class="navbar">
      <h1>🏥 Nexcore</h1>
      <div class="user-info">
        <p>مرحباً بك</p>
        <b id="displayUsername"></b>
      </div>
      <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="container">
      <!-- الإحصائيات -->
      <div class="stats">
        <div class="stat-box">
          <div class="number" id="inventoryCount">0</div>
          <div class="label">أصناف المخزون</div>
        </div>
        <div class="stat-box">
          <div class="number" id="patientsCount">0</div>
          <div class="label">المرضى المسجلين</div>
        </div>
        <div class="stat-box">
          <div class="number" id="lowStockCount">0</div>
          <div class="label">أصناف منخفضة</div>
        </div>
      </div>

      <!-- القوائم -->
      <div class="tabs">
        <button class="btn btn-primary" onclick="showSection('inventoryTab')">📦 المخزون</button>
        <button class="btn btn-primary" onclick="showSection('patientsTab')">👥 المرضى</button>
        <button class="btn btn-primary" onclick="showSection('paymentTab')">💰 الدفع عبر Pi</button>
      </div>

      <!-- تبويب المخزون -->
      <div id="inventoryTab" class="section active">
        <div class="card">
          <h2>📦 إدارة المخزون</h2>
          <div class="form-group">
            <label>اسم الصنف</label>
            <input type="text" id="itemName" placeholder="مثال: مصل">
          </div>
          <div class="form-group">
            <label>الكود</label>
            <input type="text" id="itemCode" placeholder="مثال: ITEM-001">
          </div>
          <div class="form-group">
            <label>الكمية</label>
            <input type="number" id="itemQty" value="0" min="0">
          </div>
          <div class="form-group">
            <label>الحد الأدنى</label>
            <input type="number" id="itemMin" value="10" min="0">
          </div>
          <button class="btn btn-success" onclick="addInventoryItem()" style="width: 100%;">➕ إضافة صنف</button>
          <div id="inventoryMsg" class="alert"></div>
          <div style="overflow-x: auto;">
            <table class="table">
              <thead>
                <tr>
                  <th>الاسم</th>
                  <th>الكود</th>
                  <th>الكمية</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody id="inventoryList"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- تبويب المرضى -->
      <div id="patientsTab" class="section">
        <div class="card">
          <h2>👥 إدارة المرضى</h2>
          <div class="form-group">
            <label>اسم المريض</label>
            <input type="text" id="patientName" placeholder="أدخل الاسم">
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="patientPhone" placeholder="مثال: 249123456789">
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="patientEmail" placeholder="patient@example.com">
          </div>
          <button class="btn btn-success" onclick="addPatient()" style="width: 100%;">➕ إضافة مريض</button>
          <div id="patientMsg" class="alert"></div>
          <div style="overflow-x: auto;">
            <table class="table">
              <thead>
                <tr>
                  <th>الاسم</th>
                  <th>الهاتف</th>
                  <th>البريد</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody id="patientsList"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- تبويب الدفع -->
      <div id="paymentTab" class="section">
        <div class="card">
          <h2>💰 الدفع عبر Pi Network</h2>
          <div class="form-group">
            <label>المبلغ (π)</label>
            <input type="number" id="amount" value="1" min="0.01" max="1000" step="0.01">
          </div>
          <div class="form-group">
            <label>الوصف</label>
            <input type="text" id="memo" placeholder="وصف الدفعة" maxlength="150">
          </div>
          <div class="form-group">
            <label>معرف المنتج</label>
            <input type="text" id="productId" value="PROD-001" placeholder="مثال: PROD-001">
          </div>
          <button class="btn btn-primary" id="payBtn" onclick="pay()" style="width: 100%;">
            💳 إرسال الدفعة
          </button>
          <div id="paymentMsg" class="alert"></div>
          
          <!-- نافذة نتيجة الدفع -->
          <div id="paymentResult" class="payment-result">
            <strong>✅ تم الدفع بنجاح!</strong>
            <div class="txid" id="paymentTxid"></div>
            <button class="btn btn-success" onclick="confirmPayment()" style="margin-top: 12px; width: 100%;">
              ✅ تأكيد واستلام المنتج
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========================================
    // 1. المتغيرات العامة
    // ========================================
    let piReady = false;
    let isProcessing = false;
    let currentUser = null;
    let lastPaymentId = null;
    let lastTxid = null;

    // ========================================
    // 2. دالة مساعدة للحصول على CSRF Token
    // ========================================
    function getCsrfToken() {
      const meta = document.querySelector('meta[name="csrf-token"]');
      return meta ? meta.getAttribute('content') : '';
    }

    // ========================================
    // 3. دالة مساعدة لإظهار الرسائل
    // ========================================
    function showMessage(elementId, msg, type) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.innerText = msg;
      el.className = `alert alert-${type === 'error' ? 'error' : type === 'success' ? 'success' : 'info'}`;
      el.style.display = 'block';
      
      // إخفاء تلقائي بعد 5 ثوانٍ للرسائل الناجحة
      if (type === 'success') {
        setTimeout(() => {
          el.style.display = 'none';
        }, 5000);
      }
    }

    // ========================================
    // 4. تحديث حالة Pi SDK
    // ========================================
    function updatePiStatus() {
      const el = document.getElementById('piStatus');
      if (!el) return;
      if (window.Pi) {
        el.innerText = '✅ Pi SDK جاهز للاستخدام';
        el.className = 'alert alert-success';
        el.style.display = 'block';
        document.getElementById('loginBtn').disabled = false;
      } else {
        el.innerText = '⏳ جاري تحميل Pi SDK...';
        el.className = 'alert alert-info';
        el.style.display = 'block';
        document.getElementById('loginBtn').disabled = true;
      }
    }

    // ========================================
    // 5. التأكد من جاهزية Pi
    // ========================================
    function ensurePiReady() {
      if (!window.Pi) {
        showMessage('paymentMsg', '❌ Pi SDK غير متوفر، تأكد من فتح التطبيق في Pi Browser', 'error');
        return false;
      }
      if (!piReady) {
        showMessage('paymentMsg', '⏳ جاري تحميل Pi SDK، حاول مرة أخرى', 'info');
        return false;
      }
      return true;
    }

    // ========================================
    // 6. انتظار تحميل Pi SDK
    // ========================================
    const wait = setInterval(() => {
      if (window.Pi) {
        try {
          Pi.init({ version: "2.0", sandbox: true });
          piReady = true;
          updatePiStatus();
          clearInterval(wait);
        } catch (e) {
          console.error('خطأ في تهيئة Pi:', e);
        }
      } else {
        // محاولة إعادة تحميل SDK إذا لم يتم تحميله خلال 10 ثوانٍ
        const scripts = document.querySelectorAll('script[src*="pi-sdk"]');
        if (scripts.length === 0) {
          const script = document.createElement('script');
          script.src = 'https://sdk.minepi.com/pi-sdk.js';
          document.head.appendChild(script);
        }
      }
    }, 200);

    // تأكد من تحديث الحالة بعد 5 ثوانٍ كحد أقصى
    setTimeout(() => {
      updatePiStatus();
    }, 5000);

    // ========================================
    // 7. تبديل الأقسام
    // ========================================
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(sectionId);
      if (target) target.classList.add('active');
      
      // تحميل البيانات عند التبديل
      if (sectionId === 'inventoryTab') loadInventory();
      if (sectionId === 'patientsTab') loadPatients();
      if (sectionId === 'paymentTab') {
        // إخفاء نتيجة الدفع السابقة
        document.getElementById('paymentResult').classList.remove('show');
      }
    }

    // ========================================
    // 8. تسجيل الدخول
    // ========================================
    async function login() {
      if (!ensurePiReady()) return;
      
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="loading-spinner"></span> جاري التحميل...';
      
      try {
        const auth = await Pi.authenticate(["username", "payments"], (p) => {});
        currentUser = auth.user;
        document.getElementById('displayUsername').innerText = "@" + auth.user.username;
        
        // إخفاء صفحة الدخول وإظهار لوحة التحكم
        document.getElementById('loginPage').classList.remove('active');
        document.getElementById('dashboard').classList.add('active');
        
        // تحميل البيانات
        await loadInventory();
        await loadPatients();
        await updateStats();
        
        showMessage('loginLog', '✅ تم تسجيل الدخول بنجاح! مرحباً بك ' + auth.user.username, 'success');
      } catch (e) {
        showMessage('loginLog', '❌ فشل تسجيل الدخول: ' + (e.message || 'خطأ غير معروف'), 'error');
        console.error('Login error:', e);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'تسجيل الدخول عبر Pi';
      }
    }

    // ========================================
    // 9. تسجيل الخروج
    // ========================================
    function logout() {
      if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
        currentUser = null;
        lastPaymentId = null;
        lastTxid = null;
        document.getElementById('dashboard').classList.remove('active');
        document.getElementById('loginPage').classList.add('active');
        document.getElementById('displayUsername').innerText = '';
        showMessage('loginLog', 'تم تسجيل الخروج بنجاح', 'info');
      }
    }

    // ========================================
    // 10. إدارة المخزون
    // ========================================
    async function addInventoryItem() {
      const name = document.getElementById('itemName').value.trim();
      const code = document.getElementById('itemCode').value.trim();
      const qty = parseInt(document.getElementById('itemQty').value) || 0;
      const min = parseInt(document.getElementById('itemMin').value) || 10;

      if (!name || !code) {
        showMessage('inventoryMsg', '❌ أدخل الاسم والكود', 'error');
        return;
      }

      try {
        const res = await fetch('/api/inventory', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-TOKEN': getCsrfToken()
          },
          body: JSON.stringify({ name, code, quantity: qty, min_threshold: min })
        });

        const data = await res.json();
        if (res.ok) {
          showMessage('inventoryMsg', '✅ تم إضافة الصنف بنجاح', 'success');
          document.getElementById('itemName').value = '';
          document.getElementById('itemCode').value = '';
          document.getElementById('itemQty').value = '0';
          await loadInventory();
          await updateStats();
        } else {
          showMessage('inventoryMsg', '❌ ' + (data.message || 'خطأ في الإضافة'), 'error');
        }
      } catch (e) {
        showMessage('inventoryMsg', '❌ ' + e.message, 'error');
        console.error('Error adding item:', e);
      }
    }

    async function loadInventory() {
      try {
        const res = await fetch('/api/inventory');
        const items = await res.json();
        const tbody = document.getElementById('inventoryList');
        
        if (!items || items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999;">لا توجد أصناف</td></tr>';
          document.getElementById('inventoryCount').innerText = '0';
          return;
        }
        
        tbody.innerHTML = items.map(item => `
          <tr>
            <td>${item.name}</td>
            <td>${item.code}</td>
            <td style="${item.quantity < (item.min_threshold || 10) ? 'color: red; font-weight: bold;' : ''}">
              ${item.quantity}
              ${item.quantity < (item.min_threshold || 10) ? ' ⚠️' : ''}
            </td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="deleteInventory('${item._id}')">🗑️ حذف</button>
            </td>
          </tr>
        `).join('');
        
        document.getElementById('inventoryCount').innerText = items.length;
      } catch (e) {
        console.error('Error loading inventory:', e);
        document.getElementById('inventoryList').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">خطأ في تحميل البيانات</td></tr>';
      }
    }

    async function deleteInventory(id) {
      if (!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
      try {
        const res = await fetch(`/api/inventory/${id}`, {
          method: 'DELETE',
          headers: { 'X-CSRF-TOKEN': getCsrfToken() }
        });
        if (res.ok) {
          await loadInventory();
          await updateStats();
          showMessage('inventoryMsg', '✅ تم حذف الصنف بنجاح', 'success');
        } else {
          showMessage('inventoryMsg', '❌ خطأ في الحذف', 'error');
        }
      } catch (e) {
        console.error('Error deleting item:', e);
        showMessage('inventoryMsg', '❌ ' + e.message, 'error');
      }
    }

    // ========================================
    // 11. إدارة المرضى
    // ========================================
    async function addPatient() {
      const name = document.getElementById('patientName').value.trim();
      const phone = document.getElementById('patientPhone').value.trim();
      const email = document.getElementById('patientEmail').value.trim();

      if (!name) {
        showMessage('patientMsg', '❌ أدخل اسم المريض', 'error');
        return;
      }

      try {
        const res = await fetch('/api/patients', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-TOKEN': getCsrfToken()
          },
          body: JSON.stringify({ name, phone, email })
        });

        const data = await res.json();
        if (res.ok) {
          showMessage('patientMsg', '✅ تم إضافة المريض بنجاح', 'success');
          document.getElementById('patientName').value = '';
          document.getElementById('patientPhone').value = '';
          document.getElementById('patientEmail').value = '';
          await loadPatients();
        } else {
          showMessage('patientMsg', '❌ ' + (data.message || 'خطأ في الإضافة'), 'error');
        }
      } catch (e) {
        showMessage('patientMsg', '❌ ' + e.message, 'error');
        console.error('Error adding patient:', e);
      }
    }

    async function loadPatients() {
      try {
        const res = await fetch('/api/patients');
        const patients = await res.json();
        const tbody = document.getElementById('patientsList');
        
        if (!patients || patients.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999;">لا يوجد مرضى</td></tr>';
          document.getElementById('patientsCount').innerText = '0';
          return;
        }
        
        tbody.innerHTML = patients.map(p => `
          <tr>
            <td>${p.name}</td>
            <td>${p.phone || '-'}</td>
            <td>${p.email || '-'}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="deletePatient('${p._id}')">🗑️ حذف</button>
            </td>
          </tr>
        `).join('');
        
        document.getElementById('patientsCount').innerText = patients.length;
      } catch (e) {
        console.error('Error loading patients:', e);
        document.getElementById('patientsList').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">خطأ في تحميل البيانات</td></tr>';
      }
    }

    async function deletePatient(id) {
      if (!confirm('هل أنت متأكد من حذف هذا المريض؟')) return;
      try {
        const res = await fetch(`/api/patients/${id}`, {
          method: 'DELETE',
          headers: { 'X-CSRF-TOKEN': getCsrfToken() }
        });
        if (res.ok) {
          await loadPatients();
          showMessage('patientMsg', '✅ تم حذف المريض بنجاح', 'success');
        } else {
          showMessage('patientMsg', '❌ خطأ في الحذف', 'error');
        }
      } catch (e) {
        console.error('Error deleting patient:', e);
        showMessage('patientMsg', '❌ ' + e.message, 'error');
      }
    }

    // ========================================
    // 12. تحديث الإحصائيات
    // ========================================
    async function updateStats() {
      try {
        const res = await fetch('/api/inventory/low-stock');
        if (res.ok) {
          const lowItems = await res.json();
          document.getElementById('lowStockCount').innerText = lowItems ? lowItems.length : 0;
        } else {
          document.getElementById('lowStockCount').innerText = '0';
        }
      } catch (e) {
        console.error('Error updating stats:', e);
        document.getElementById('lowStockCount').innerText = '0';
      }
    }

    // ========================================
    // 13. جلب حالة الدفع
    // ========================================
    async function getPaymentStatus(paymentId) {
      try {
        const res = await fetch(`/api/payment/${paymentId}/status`);
        const data = await res.json();
        return data;
      } catch (e) {
        console.error('Error fetching payment status:', e);
        return null;
      }
    }

    // ========================================
    // 14. معالجة الدفع
    // ========================================
    async function pay() {
      if (isProcessing) {
        showMessage('paymentMsg', '⏳ جاري معالجة دفعة سابقة، انتظر قليلاً', 'info');
        return;
      }
      
      if (!ensurePiReady()) return;
      if (!currentUser) {
        showMessage('paymentMsg', '❌ يجب تسجيل الدخول أولاً', 'error');
        return;
      }

      const amount = parseFloat(document.getElementById('amount').value);
      const memo = document.getElementById('memo').value.trim();
      const productId = document.getElementById('productId').value.trim() || 'PROD-001';

      if (!amount || amount <= 0 || amount > 1000) {
        showMessage('paymentMsg', '❌ أدخل مبلغ صحيح (بين 0.01 و 1000)', 'error');
        return;
      }
      if (!memo || memo.length < 3) {
        showMessage('paymentMsg', '❌ أدخل وصفاً (3 أحرف على الأقل)', 'error');
        return;
      }

      isProcessing = true;
      const payBtn = document.getElementById('payBtn');
      payBtn.disabled = true;
      payBtn.innerHTML = '<span class="loading-spinner"></span> جاري المعالجة...';
      
      // إخفاء النتيجة السابقة
      document.getElementById('paymentResult').classList.remove('show');

      try {
        showMessage('paymentMsg', '⏳ جاري إنشاء الدفعة...', 'info');

        Pi.createPayment(
          {
            amount: amount,
            memo: memo,
            metadata: {
              app: "nexcore",
              productId: productId,
              username: currentUser.username,
              timestamp: new Date().toISOString()
            }
          },
          {
            onReadyForServerApproval: async (paymentId) => {
              console.log('onReadyForServerApproval:', paymentId);
              lastPaymentId = paymentId;
              
              try {
                // التحقق من حالة الدفع أولاً
                const status = await getPaymentStatus(paymentId);
                if (status && status.verified) {
                  const res = await fetch('/api/approve', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'X-CSRF-TOKEN': getCsrfToken()
                    },
                    body: JSON.stringify({ paymentId })
                  });
                  
                  if (!res.ok) throw new Error('فشل الموافقة على الدفع');
                  showMessage('paymentMsg', '✅ تمت الموافقة على الدفع، في انتظار الإكمال...', 'success');
                } else {
                  throw new Error('الدفع غير موثوق');
                }
              } catch (e) {
                showMessage('paymentMsg', '❌ فشل الموافقة: ' + e.message, 'error');
                isProcessing = false;
                payBtn.disabled = false;
                payBtn.innerHTML = '💳 إرسال الدفعة';
              }
            },
            onReadyForServerCompletion: async (paymentId, txid) => {
              console.log('onReadyForServerCompletion:', paymentId, txid);
              lastPaymentId = paymentId;
              lastTxid = txid;
              
              try {
                const res = await fetch('/api/complete', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': getCsrfToken()
                  },
                  body: JSON.stringify({ paymentId, txid })
                });
                
                if (res.ok) {
                  showMessage('paymentMsg', '✅ تمت الدفعة بنجاح!', 'success');
                  
                  // إظهار نتيجة الدفع
                  document.getElementById('paymentTxid').innerText = 'رقم المعاملة: ' + txid;
                  document.getElementById('paymentResult').classList.add('show');
                  
                  // تفريغ الحقول
                  document.getElementById('amount').value = '1';
                  document.getElementById('memo').value = '';
                } else {
                  const data = await res.json();
                  throw new Error(data.message || 'فشل إكمال الدفع');
                }
              } catch (e) {
                showMessage('paymentMsg', '❌ فشل الإكمال: ' + e.message, 'error');
              } finally {
                isProcessing = false;
                payBtn.disabled = false;
                payBtn.innerHTML = '💳 إرسال الدفعة';
              }
            },
            onCancel: (paymentId) => {
              console.log('onCancel:', paymentId);
              showMessage('paymentMsg', '⚠️ تم إلغاء الدفعة', 'info');
              isProcessing = false;
              payBtn.disabled = false;
              payBtn.innerHTML = '💳 إرسال الدفعة';
            },
            onError: (error, payment) => {
              console.error('onError:', error, payment);
              showMessage('paymentMsg', '❌ خطأ: ' + (error.message || 'خطأ غير معروف'), 'error');
              isProcessing = false;
              payBtn.disabled = false;
              payBtn.innerHTML = '💳 إرسال الدفعة';
            }
          }
        );
      } catch (e) {
        showMessage('paymentMsg', '❌ ' + e.message, 'error');
        isProcessing = false;
        payBtn.disabled = false;
        payBtn.innerHTML = '💳 إرسال الدفعة';
        console.error('Payment error:', e);
      }
    }

    // ========================================
    // 15. تأكيد استلام المنتج
    // ========================================
    async function confirmPayment() {
      if (!lastPaymentId) {
        showMessage('paymentMsg', '❌ لا توجد دفعة نشطة للتأكيد', 'error');
        return;
      }
      
      try {
        const res = await fetch('/api/confirm-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-TOKEN': getCsrfToken()
          },
          body: JSON.stringify({
            paymentId: lastPaymentId,
            txid: lastTxid,
            confirmed: true
          })
        });
        
        if (res.ok) {
          showMessage('paymentMsg', '✅ تم تأكيد استلام المنتج بنجاح!', 'success');
          document.getElementById('paymentResult').classList.remove('show');
          lastPaymentId = null;
          lastTxid = null;
        } else {
          showMessage('paymentMsg', '❌ فشل تأكيد استلام المنتج', 'error');
        }
      } catch (e) {
        showMessage('paymentMsg', '❌ ' + e.message, 'error');
        console.error('Error confirming payment:', e);
      }
    }

    // ========================================
    // 16. التحميل التلقائي للبيانات عند بدء التشغيل
    // ========================================
    // يتم تحميل البيانات بعد تسجيل الدخول فقط
    console.log('Nexcore v2.0 - جاهز للاستخدام 🚀');
  </script>
</body>
