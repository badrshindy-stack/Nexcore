<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Nexcore - Pi Network App</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px; max-width: 400px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      width: 80px; height: 80px; margin: 0 auto 20px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: bold;
    }
    h1 { text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; opacity: 0.8; margin-bottom: 24px; font-size: 14px; }
    button {
      width: 100%; padding: 14px;
      background: #fff; color: #6a11cb;
      border: none; border-radius: 14px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input {
      width: 100%; padding: 12px;
      border: none; border-radius: 12px;
      margin-top: 8px; font-size: 16px;
    }
    label { display: block; margin-top: 12px; font-size: 14px; }
    .log {
      margin-top: 16px; padding: 12px;
      background: rgba(0,0,0,0.2); border-radius: 12px;
      font-size: 13px; min-height: 20px; text-align: center;
    }
    .user-box {
      background: rgba(255,255,255,0.15);
      padding: 12px; border-radius: 12px; margin-bottom: 16px;
      text-align: center;
    }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">π</div>
    <h1>Nexcore</h1>
    <p class="subtitle">تطبيق Pi Network</p>

    <div id="loginSection">
      <button id="loginBtn" onclick="login()" style="cursor: pointer;">تسجيل الدخول عبر Pi</button>
    </div>

    <div id="paySection" style="display:none">
      <div class="user-box">مرحباً <b id="username"></b> 👋</div>
      <label>المبلغ (π)</label>
      <input type="number" id="amount" value="1" min="0.01" max="1000" step="0.01">
      <label>الوصف</label>
      <input type="text" id="memo" value="" maxlength="150" placeholder="أدخل وصف للدفعة">
      <button id="payBtn" onclick="pay()">إرسال الدفعة</button>
    </div>

    <div class="log" id="log">جاري تحميل SDK...</div>
  </div>

<script>
  let piReady = false;
  let isProcessing = false;
  const MAX_WAIT_TIME = 5000; // 5 seconds
  const log = (msg, isError = false) => {
    const logEl = document.getElementById('log');
    logEl.innerText = msg;
    logEl.className = isError ? 'log error' : 'log success';
  };

  // انتظر تحميل Pi SDK مع timeout
  const wait = setInterval(() => {
    if (window.Pi) {
      Pi.init({ version: "2.0", sandbox: true });
      piReady = true;
      log("جاهز — اضغط تسجيل الدخول");
      clearInterval(wait);
    }
  }, 200);

  // إلغاء الانتظار بعد 5 ثوان
  setTimeout(() => {
    if (!piReady) {
      clearInterval(wait);
      log("⚠️ تحذير: تأكد من فتح التطبيق داخل Pi Browser", true);
    }
  }, MAX_WAIT_TIME);

  async function login() {
    if (!piReady) {
      log("❌ افتح التطبيق داخل Pi Browser", true);
      return;
    }
    try {
      const auth = await Pi.authenticate(
        ["username", "payments"],
        (p) => console.warn("incomplete payment", p)
      );
      document.getElementById('username').innerText = "@" + sanitizeUsername(auth.user.username);
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('paySection').style.display = 'block';
      log("✅ تم تسجيل الدخول بنجاح");
    } catch (e) {
      log("❌ فشل تسجيل الدخول: " + sanitizeError(e.message), true);
    }
  }

  async function pay() {
    if (isProcessing) return;
    
    const amount = parseFloat(document.getElementById('amount').value);
    const memo = document.getElementById('memo').value.trim();

    // التحقق من صحة المدخلات
    if (!amount || amount <= 0 || amount > 1000) {
      log("❌ أدخل مبلغ صحيح (0.01 - 1000)", true);
      return;
    }

    if (!memo || memo.length < 3) {
      log("❌ أدخل وصفاً للدفعة (3 أحرف على الأقل)", true);
      return;
    }

    isProcessing = true;
    document.getElementById('payBtn').disabled = true;

    try {
      log("⏳ جاري إنشاء الدفعة...");
      
      Pi.createPayment(
        { amount, memo, metadata: { app: "nexcore_v1" } },
        {
          onReadyForServerApproval: async (paymentId) => {
            try {
              log("⏳ موافقة السيرفر...");
              const r = await fetch('/api/approve', {
                method: 'POST',
                headers: { 
                  'Content-Type': 'application/json',
                  'X-CSRF-Token': getCsrfToken()
                },
                body: JSON.stringify({ paymentId }),
                signal: AbortSignal.timeout(10000) // 10 second timeout
              });
              
              if (!r.ok) {
                const errMsg = await r.text();
                throw new Error(sanitizeError(errMsg));
              }
            } catch (e) {
              log("❌ فشل الموافقة: " + e.message, true);
              isProcessing = false;
              document.getElementById('payBtn').disabled = false;
            }
          },
          onReadyForServerCompletion: async (paymentId, txid) => {
            try {
              log("⏳ إكمال الدفعة...");
              const r = await fetch('/api/complete', {
                method: 'POST',
                headers: { 
                  'Content-Type': 'application/json',
                  'X-CSRF-Token': getCsrfToken()
                },
                body: JSON.stringify({ paymentId, txid }),
                signal: AbortSignal.timeout(10000)
              });
              
              if (r.ok) {
                log("✅ تمت الدفعة! TxID: " + txid.slice(0, 12) + "...");
              } else {
                throw new Error(await r.text());
              }
            } catch (e) {
              log("❌ فشل الإكمال: " + sanitizeError(e.message), true);
            } finally {
              isProcessing = false;
              document.getElementById('payBtn').disabled = false;
            }
          },
          onCancel: () => {
            log("⚠️ تم إلغاء الدفعة");
            isProcessing = false;
            document.getElementById('payBtn').disabled = false;
          },
          onError: (err) => {
            log("❌ خطأ: " + sanitizeError(err.message), true);
            isProcessing = false;
            document.getElementById('payBtn').disabled = false;
          }
        }
      );
    } catch (e) {
      log("❌ خطأ غير متوقع: " + sanitizeError(e.message), true);
      isProcessing = false;
      document.getElementById('payBtn').disabled = false;
    }
  }

  // تنظيف القيم للأمان
  function sanitizeUsername(username) {
    return String(username).replace(/[<>"&]/g, '');
  }

  function sanitizeError(msg) {
    const maxLen = 100;
    return String(msg).substring(0, maxLen).replace(/[<>"&]/g, '');
  }

  // الحصول على CSRF token
  function getCsrfToken() {
    return document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
  }
</script>
</body>
</html>
